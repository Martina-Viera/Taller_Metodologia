<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Veterinaria Huella</title>
</head>

<body>
    <header id="header">
        <nav class="nav">
            <ul class="menu">
                <li>Inicio</li>
                <li>Reserva de Turnos</li>
                <li>Contacto</li>
                <li id="menu-admin" class="oculto">Listado de Turnos</li>
            </ul>
        </nav>
    </header>

    <section id="inicio" class="inicio">
        <img src="src/img/portada.jpg" alt="Imagen principal veterinaria" width="1090" height="1080" class="imagen-inicio">

        <div class="contenido-inicio">
            <h1>Cuidamos la Salud de tu Mascota</h1>

            <a href="#reservas" class="btn-reservas">
                Reserva de Turnos
            </a>
        </div>
    </section>

    <section class="card">
      <form class="form" action="#" method="post">
        <div class="grid">
          <!-- Columna izquierda -->
          <div class="panel">
            <div class="panel__header">
              <!-- Ícono usuario (SVG) -->
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2.25c-4.35 0-7.875 2.137-7.875 4.775V21h15.75v-1.975c0-2.638-3.525-4.775-7.875-4.775Z"/>
              </svg>
              <h2 class="panel__title">Datos del Dueño</h2>
            </div>

            <div class="field">
              <label for="ownerName">Nombre Completo <span class="req">*</span></label>
              <input id="ownerName" name="ownerName" type="text" placeholder="Ej: Juan Pérez" required />
            </div>

            <div class="field">
              <label for="phone">Teléfono <span class="req">*</span></label>
              <input id="phone" name="phone" type="tel" placeholder="099 123 456" required />
              <small class="hint">Formato: 099 xxx xxx</small>
            </div>

            <div class="field">
              <label for="email">Email <span class="req">*</span></label>
              <input id="email" name="email" type="email" placeholder="usuario@ejemplo.com" required />
            </div>
          </div>

          <!-- Columna derecha -->
          <div class="panel">
            <div class="panel__header">
              <!-- Ícono patita (SVG) -->
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.5 12.5c-1.4 0-2.5-1.4-2.5-3s1.1-3 2.5-3S9 7.9 9 9.5s-1.1 3-2.5 3Zm11 0c-1.4 0-2.5-1.4-2.5-3s1.1-3 2.5-3 2.5 1.4 2.5 3-1.1 3-2.5 3ZM9.75 7.25c-1.2 0-2.2-1.2-2.2-2.65S8.55 2 9.75 2s2.2 1.2 2.2 2.6-1 2.65-2.2 2.65Zm4.5 0c-1.2 0-2.2-1.2-2.2-2.65S13.05 2 14.25 2s2.2 1.2 2.2 2.6-1 2.65-2.2 2.65ZM12 22c-3.6 0-6.5-2.2-6.5-4.9 0-1.8 1.2-3.2 3.2-3.9.7-.2 1.5-.2 2.3-.1.3 0 .6.1 1 .1s.7 0 1-.1c.8-.1 1.6-.1 2.3.1 2 .7 3.2 2.1 3.2 3.9C18.5 19.8 15.6 22 12 22Z"/>
              </svg>
              <h2 class="panel__title">Datos de la Mascota</h2>
            </div>

            <div class="row">
              <div class="field">
                <label for="petName">Nombre Mascota <span class="req">*</span></label>
                <input id="petName" name="petName" type="text" placeholder="Ej: Bobby" required />
              </div>

              <div class="field">
                <label for="animalType">Tipo de Animal <span class="req">*</span></label>
                <select id="animalType" name="animalType" required>
                  <option value="Perro" selected>Perro</option>
                  <option value="Gato">Gato</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="service">Servicio <span class="req">*</span></label>
              <select id="service" name="service" required>
                <option value="" disabled selected>Selecciona un servicio</option>
                <option value="corte-pelo">Corte de Pelo ($1500)</option>
                <option value="consulta">Consulta Veterinaria ($1200)</option>
                <option value="vacuna">Vacunación ($900)</option>
              </select>
            </div>

            <div class="field">
              <label for="professional">Profesional <span class="req">*</span></label>
              <select id="professional" name="professional" required>
                <option value="" disabled selected>Selecciona profesional</option>
                <option value="laura-martinez">Laura Martínez - Especialista en Canino</option>
                <option value="martin-suarez">Martín Suárez - Veterinario</option>
                <option value="sofia-rodriguez">Sofía Rodríguez - Estética</option>
              </select>
            </div>
          </div>

          <!-- Fila inferior (full width) -->
          <div class="panel panel--full">
            <div class="row row--bottom">
              <div class="field">
                <label for="date">Fecha <span class="req">*</span></label>
                <input id="date" name="date" type="date" required />
              </div>

              <div class="field">
                <label for="time">Hora <span class="req">*</span></label>
                <select id="time" name="time" required>
                  <option value="" disabled selected>Selecciona hora</option>
                  <option>09:00</option>
                  <option>09:30</option>
                  <option>10:00</option>
                  <option>10:30</option>
                  <option>11:00</option>
                  <option>11:30</option>
                  <option>12:00</option>
                  <option>12:30</option>
                  <option>13:00</option>
                  <option>13:30</option>
                  <option>14:00</option>
                  <option>14:30</option>
                  <option>15:00</option>
                  <option>15:30</option>
                  <option>16:00</option>
                  <option>16:30</option>
                  <option>17:00</option>
                  <option>17:30</option>
                </select>
              </div>

              <div class="field">
                <label for="payment">Forma de Pago <span class="req">*</span></label>
                <select id="payment" name="payment" required>
                  <option value="Efectivo" selected>Efectivo</option>
                  <option value="Transferencia">Transferencia</option>
                  <option value="Web">Web</option>
                </select>
              </div>
            </div>

            <button class="btn" type="submit">Confirmar Reserva</button>
          </div>
        </div>
      </form>
    </section> 














    <script src="src/app.js"></script>
    <script src="src/core/reservas.js"></script>
    <script src="script.js"></script>

</body>

</html>
